<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Server Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1 id="server-name">Silly Server</h1>
    </div>

    <div class="card-content">
      <!-- Left Column: Icon -->
      <div class="server-icon">
        <img src="icon.png" alt="Server Icon" id="server-icon">
      </div>

      <!-- Middle Column: Status & Info -->
      <div class="server-info">
        <p id="status"><span class="status-dot">⚪</span> Checking...</p>
        <p id="players">Players: ?/?</p>
        <p id="version">Version: ?</p>
        <p id="refresh">⏳ Refresh in: <span id="timer">60</span>s</p>
      </div>

      <!-- Right Column: Online Players -->
      <div class="player-list">
        <h3>Online Players</h3>
        <ul id="online-players"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
