<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Server Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" aria-live="polite">
    <header class="card-header">
      <img id="server-icon" class="server-icon" alt="Minecraft server icon" hidden>
      <div>
        <h1 id="server-name">Loading server…</h1>
        <p id="server-motd" class="server-motd"></p>
      </div>
    </header>

    <section class="card-content">
      <div id="server-info" class="server-info" aria-label="Server details"></div>
      <section class="player-list" aria-labelledby="players-title">
        <h2 id="players-title">Online players</h2>
        <ul id="online-players"></ul>
      </section>
    </section>
    <p id="refresh" class="refresh">Refreshing in <span id="timer">60</span>s</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
